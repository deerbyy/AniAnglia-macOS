name: AniAnglia
options:
  bundleIdPrefix: com.deerbyy
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "NO"
    SWIFT_STRICT_CONCURRENCY: complete
    GCC_WARN_UNUSED_VARIABLE: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  AniAnglia:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/AniAnglia
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: AniAnglia
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        CFBundlePackageType: APPL
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
        NSHumanReadableCopyright: "© deerbyy"
        NSSupportsAutomaticGraphicsSwitching: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deerbyy.AniAnglia
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: "YES"
        CODE_SIGN_ENTITLEMENTS: Resources/AniAnglia.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
